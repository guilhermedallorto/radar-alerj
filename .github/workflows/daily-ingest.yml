name: Radar ALERJ — coleta e verificação de edições

on:
  schedule:
    # Coleta da edição regular, todos os dias às 9h05 de Brasília.
    - cron: '5 9 * * *'
      timezone: 'America/Sao_Paulo'
    # Segunda checagem diária para identificar uma eventual edição extra.
    - cron: '0 22 * * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Tipo de edição a verificar manualmente'
        required: true
        type: choice
        options:
          - regular
          - extra
          - both
        default: both

permissions:
  contents: read

# Impede sobreposição entre verificações agendadas e execuções manuais.
concurrency:
  group: radar-alerj-ingest
  cancel-in-progress: false

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências Python
        run: pip install -r worker/requirements.txt

      - name: Instalar Chromium para o visualizador PDF.js da IOERJ
        run: python -m playwright install --with-deps chromium

      - name: Consultar IOERJ, processar e atualizar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EDITION_SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_mode || (github.event.schedule == '0 22 * * *' && 'extra' || 'regular') }}
        run: python worker/ingest.py
