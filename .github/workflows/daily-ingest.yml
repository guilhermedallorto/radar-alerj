name: Radar ALERJ — coleta diária

on:
  schedule:
    # 09h05 no fuso de Brasília (America/Sao_Paulo), todos os dias.
    # O minuto 05 evita o pico de agendamentos no início da hora.
    - cron: '5 9 * * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências Python
        run: pip install -r worker/requirements.txt

      - name: Instalar Chromium para o visualizador PDF.js da IOERJ
        run: python -m playwright install --with-deps chromium

      - name: Consultar IOERJ, processar e atualizar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python worker/ingest.py
