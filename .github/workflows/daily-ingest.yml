name: Radar ALERJ — coleta e verificação de edições

on:
  # O agendamento passa a ser controlado pelo Supabase Cron.
  # O Supabase dispara este workflow via workflow_dispatch nos horários locais definidos.
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Tipo de edição a verificar'
        required: true
        type: choice
        options:
          - regular
          - extra
          - both
        default: both
      edition_date:
        description: 'Data específica da edição regular (YYYY-MM-DD; opcional)'
        required: false
        type: string

permissions:
  contents: read

# Impede sobreposição entre verificações agendadas e execuções manuais.
concurrency:
  group: radar-alerj-ingest
  cancel-in-progress: false

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Diagnóstico do disparo e dos fusos
        env:
          RADAR_EVENT_NAME: ${{ github.event_name }}
          RADAR_SCAN_MODE: ${{ inputs.scan_mode || 'both' }}
          RADAR_EDITION_DATE: ${{ inputs.edition_date || 'mais recente' }}
        run: |
          echo "Evento: ${RADAR_EVENT_NAME}"
          echo "Modo solicitado: ${RADAR_SCAN_MODE}"
          echo "Data específica: ${RADAR_EDITION_DATE}"
          echo "Horário UTC: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Horário de Brasília: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "GitHub Run ID: ${{ github.run_id }}"
          echo "Branch: ${{ github.ref }}"

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências Python
        run: pip install -r worker/requirements.txt

      - name: Instalar Chromium para o visualizador PDF.js da IOERJ
        run: python -m playwright install --with-deps chromium

      - name: Consultar IOERJ, processar e atualizar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EDITION_SCAN_MODE: ${{ inputs.scan_mode || 'both' }}
          EDITION_TARGET_DATE: ${{ inputs.edition_date || '' }}
        run: python worker/ingest.py
