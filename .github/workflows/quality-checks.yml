name: Radar ALERJ — testes de qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar dependências
        run: pip install -r worker/requirements.txt

      - name: Verificar sintaxe Python
        run: python -m compileall -q worker tests

      - name: Executar testes automatizados
        run: python -m unittest discover -s tests -v
