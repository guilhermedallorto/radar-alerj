name: Radar ALERJ — coleta diária

on:
  schedule:
    # 09h15 no fuso America/Sao_Paulo, todos os dias.
    # O GitHub pode atrasar execuções agendadas em períodos de alta demanda.
    - cron: '15 9 * * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Instalar OCR em português
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Instalar dependências
        run: pip install -r worker/requirements.txt

      - name: Consultar IOERJ, processar e atualizar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python worker/ingest.py
